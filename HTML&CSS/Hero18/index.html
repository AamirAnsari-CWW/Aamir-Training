<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero18</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="container">
            <div class="hero-text">
                <h1>Care-Fair! <span>Mother like Care</span> for Your Young Ones</h1>
                <p>We offer a wide range of dental services, from cosmetic dentistry makeovers to oral surgery and dental implants.</p>
            </div>
            <div class="hero-image">
                <img src="images/Hero18.png">
            </div>

            <form class="booking-form">
                <div class="form-box">
                    <div class="form-title">
                        <img src="images/icons/email.png">
                        <label>Email Address</label>
                    </div>
                    <input type="email" placeholder="Your Email">
                </div>

                <div class="form-box">
                    <div class="form-title">
                        <img src="images/icons/phone.png">
                        <label>Phone Number</label>
                    </div>
                    <input type="text" placeholder="Your Email">
                </div>

                <div class="form-box">
                    <div class="form-title">
                        <img src="images/icons/calendar.png">
                        <label>Date</label>
                    </div>
                    <input type="text" placeholder="Your Email">
                </div>

                <button type="submit">
                    <img src="images/icons/booknow.png">
                    Book Now
                </button>
            </form>
        </div>
    </section>
</body>
</html>
