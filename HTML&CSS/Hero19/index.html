<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero 19</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="hero">
        <div class="hero-content">
            <img class="top-icon" src="images/icon-top.png">
            <h1>Step into the Future</h1>
            <p>Powerful, self-serve product analytics to help you convert, engage, and retain more users.</p>

            <div class="buttons">
                <a href="#">Request A <span>Demo</span></a>
                <a href="#">Start Free Trial Today</a>
            </div>
        </div>

        <div class="hero-image">
            <img class="circle-img" src="images/rw-circle.png">
            <img class="bg-img bg-left" src="images/hero21.png">
            <img class="bg-img bg-right" src="images/hero21.png">
            <img class="dashboard-img" src="images/hero21.png" alt="Dashboard">
            <img class="diamond-img" src="images/diamond.png">
            <img class="pi-img" src="images/pi.png">
        </div>
    </section>
</body>

</html>
