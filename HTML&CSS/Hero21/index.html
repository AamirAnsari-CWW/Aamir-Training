<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero 21</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="hero">
        <div class="container">
            <div class="heading">
                <h1>Digitize your<br> financial</h1>
                <img src="images/left circle.png" alt="">
            </div>

            <div class="hero-image">
                <img src="images/hero21.png" alt="Digital finance app preview">
            </div>

            <div class="right-content">
                <p>Money should be easy. It’s time to say goodbye to banks & financial services companies that don’t
                    work for you.</p>
                <div class="play">
                    <button type="button">Digitize Now</button>
                    <a href="#">
                        <img src="images/right-circle-play.png" alt="Play video">
                    </a>
                </div>
            </div>

            <div class="user-stats">
                <div class="faces">
                    <img src="images/right-faces.png" alt="Active user avatars">
                    <span>12M</span>
                </div>
                <div class="dot">
                    <img src="images/right-dot.png" alt="">
                    <p>World active user</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
