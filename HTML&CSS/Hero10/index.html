<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero10</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="hero">
        <div class="container">
            <div class="hero-image">
                <img src="images/Hero10.png" alt="hero">
            </div>

            <div class="hero-text">
                <!-- left side content -->
                <div class="left-content">
                    <h1 class="left-title">Lets Create Your Dream Space</h1>

                    <div class="left-details">
                        <div class="stat-item">
                            <h2>2.5k</h2>
                            <p>Constructions Done</p>
                        </div>

                        <div class="stat-item">
                            <h2>8M</h2>
                            <p>Satisfied and Happy User</p>
                        </div>

                        <div class="quote-box">
                            <div class="input-box">
                                <input type="text" placeholder="Tell Us About Your Mind">
                            </div>

                            <button>Get Quote</button>
                        </div>
                    </div>

                </div>
                <!-- right side content -->
                <div class="right-content">
                    <div class="circle-img">
                    <a href="#"> <img src="images/circle.png"> </a>
                    </div>

                    <div class="circle-text">
                        <h2>Explore<br>Services</h2>
                    </div>

                </div>

            </div>
        </div>
    </section>
</body>

</html>
