<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero 6</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="hero">
        <div class="container">
            <div class="hero-overlay"></div>

            <!-- left text -->
            <div class="hero-text">

                <h1>Hire the <span class="underline">best chef<img src="images/underline.svg" class="underline-img"></span><br> for any <span>occassion.</span></h1>

                <p>Millions of people use chez You to make their parties awesome.</p>

                <div class="buttons">
                    <button class="chef" onclick="alert('button clicked')">Book a Chef</button>
                    <button class="event" onclick="alert('button clicked')">Plan a Event</button>
                </div>
            </div>

            <!-- right image -->
            <div class="image">
                <img src="images/hero6.png" alt="hero image">
            </div>
        </div>
    </section>
</body>

</html>
